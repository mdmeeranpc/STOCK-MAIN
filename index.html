<!DOCTYPE html>
<html>
<head>
  <title>GLOBAL INDIA CERAMICS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f1f5f9;
    }

    header {
      background: linear-gradient(135deg, #1e3a8a, #0f172a);
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      padding: 12px;
    }

    .search-box {
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }

    .top-bar {
      display: flex;
      gap: 10px;
      margin: 10px 0;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 14px;
    }

    .refresh {
      background: #f59e0b;
    }

    .cart {
      background: #22c55e;
    }

    #lastUpdated {
      font-size: 12px;
      color: gray;
      margin-bottom: 10px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .name {
      font-weight: bold;
      font-size: 15px;
    }

    .stock {
      font-size: 13px;
    }

    .low { color: orange; }
    .out { color: red; }

    .qty {
      width: 60px;
      padding: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      text-align: center;
    }

    .add {
      margin-top: 5px;
      padding: 5px 10px;
      background: #3b82f6;
      color: white;
      border-radius: 6px;
      border: none;
    }

  </style>
</head>

<body>

<header>🛠️ GLOBAL INDIA CERAMICS</header>

<div class="container">

  <div class="search-box">
    <input type="text" id="search" placeholder="🔍 Search product..." onkeyup="searchProduct()">
  </div>

  <div class="top-bar">
    <button id="refreshBtn" class="refresh" onclick="refreshData()">🔄 Refresh</button>
    <button class="cart" onclick="sendCart()">🛒 Order</button>
  </div>

  <div id="lastUpdated">Last updated: --</div>

  <div id="stockList">Loading...</div>

</div>

<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ7ErfBOZPbe4khlHRrx5wgEFl6D13sWJ9Tk9TKhRVSgJ3edXB6Pe7NHygWEHsAbf9mcXkypsvdf9nU/pub?gid=0&single=true&output=csv";

let cart = [];
let allProducts = [];

function loadData(){
  document.getElementById("stockList").innerHTML = "Loading...";

  fetch(sheetURL)
    .then(res => res.text())
    .then(data => {
      let rows = data.split("\n").slice(1);
      allProducts = [];

      rows.forEach(row=>{
        let cols = row.split(",");
        let product = cols[0];
        let qty = parseInt(cols[1]);

        if(!product) return;

        allProducts.push({product, qty});
      });

      renderProducts(allProducts);

      document.getElementById("lastUpdated").innerText =
        "Last updated: " + new Date().toLocaleTimeString();
    });
}

function renderProducts(products){
  let container = document.getElementById("stockList");
  container.innerHTML = "";

  products.forEach(item=>{
    let cls = "";
    let text = item.qty;

    if(item.qty === 0){ text="Out"; cls="out"; }
    else if(item.qty < 5){ text=item.qty+" (Low)"; cls="low"; }

    let id = btoa(item.product);

    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div>
        <div class="name">${item.product}</div>
        <div class="stock ${cls}">Stock: ${text}</div>
      </div>

      <div>
        <input type="number" min="1" max="${item.qty}" value="1" id="qty-${id}" class="qty">
        ${
          item.qty === 0
          ? `<div style="color:gray;">Out</div>`
          : `<button class="add" onclick="addToCart('${item.product}', ${item.qty})">Add</button>`
        }
      </div>
    `;

    container.appendChild(div);
  });
}

function addToCart(product, stockQty){
  let id = "qty-" + btoa(product);
  let qty = parseInt(document.getElementById(id).value);

  if(!qty || qty<=0) return toast("Enter valid qty");
  if(qty > stockQty) return toast("Not enough stock");

  cart.push({product, qty});
  toast(product + " added");
}

function sendCart(){
  if(!cart.length) return toast("Cart empty");

  let msg = "Hello, I want to order:\n\n";
  cart.forEach(i=>{
    msg += `${i.product} - Qty: ${i.qty}\n`;
  });

  window.open(`https://wa.me/916360397604?text=${encodeURIComponent(msg)}`);
  cart=[];
}

function searchProduct(){
  let input = document.getElementById("search").value.toLowerCase();
  let filtered = allProducts.filter(p=>p.product.toLowerCase().includes(input));
  renderProducts(filtered);
}

function refreshData(){
  let btn = document.getElementById("refreshBtn");

  btn.innerText = "⏳ Updating...";
  btn.disabled = true;

  loadData();

  setTimeout(()=>{
    btn.innerText = "✅ Updated";
    setTimeout(()=>{
      btn.innerText = "🔄 Refresh";
      btn.disabled = false;
    },1500);
  },1000);
}

function toast(msg){
  let t=document.createElement("div");
  t.innerText=msg;
  t.style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:white;padding:10px;border-radius:8px;";
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2000);
}

setInterval(loadData,30000);

loadData();
</script>

</body>
</html>
