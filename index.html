<!DOCTYPE html>
<html>
<head>
  <title>GLOBAL INDIA CERAMICStitle>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1f2d3d">

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #eef2f7;
    }

    header {
      background: #1f2d3d;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 22px;
    }

    .container {
      padding: 15px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: none;
      border-radius: 8px;
      background: #3498db;
      color: white;
      font-size: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    th {
      background: #3498db;
      color: white;
      padding: 12px;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    tr:hover {
      background: #f1f1f1;
    }

    .out {
      color: red;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      color: gray;
    }
  </style>
</head>

<body>

<header>🛠️ ELITE SANITARY STORE</header>

<div class="container">

  <input type="text" id="search" placeholder="Search product..." onkeyup="searchProduct()">
  
  <button onclick="loadData()">🔄 Refresh Stock</button>

  <table id="stockTable">
    <tr>
      <th>Product</th>
      <th>Quantity</th>
    </tr>
  </table>

</div>

<footer>
  Live Stock | Install this app on your phone 📲
</footer>

<script>
  const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ7ErfBOZPbe4khlHRrx5wgEFl6D13sWJ9Tk9TKhRVSgJ3edXB6Pe7NHygWEHsAbf9mcXkypsvdf9nU/pub?gid=0&single=true&output=csv";

  function loadData() {
    let table = document.getElementById("stockTable");
    table.innerHTML = `
      <tr>
        <th>Product</th>
        <th>Quantity</th>
      </tr>
    `;

    fetch(sheetURL)
      .then(res => res.text())
      .then(data => {
        let rows = data.split("\n").slice(1);

        rows.forEach(row => {
          let cols = row.split(",");
          let product = cols[0];
          let qty = parseInt(cols[1]);

          if (!product) return;

          let tr = document.createElement("tr");
          let qtyText = (!qty && qty !== 0) ? "-" : (qty === 0 ? "Out of Stock" : qty);

          tr.innerHTML = `
            <td>${product}</td>
            <td class="${qty === 0 ? "out" : ""}">${qtyText}</td>
          `;

          table.appendChild(tr);
        });
      });
  }

  function searchProduct() {
    let input = document.getElementById("search").value.toLowerCase();
    let rows = document.querySelectorAll("#stockTable tr");

    rows.forEach((row, index) => {
      if (index === 0) return;
      let text = row.innerText.toLowerCase();
      row.style.display = text.includes(input) ? "" : "none";
    });
  }

  loadData();

  // Service Worker (App mode)
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>

</body>
</html>
