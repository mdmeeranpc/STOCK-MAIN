<!DOCTYPE html>
<html>
<head>
  <title>GLOBAL INDIA CERAMICS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
  background: linear-gradient(135deg, #667eea, #764ba2);
}

/* HEADER */
header {
  background: linear-gradient(135deg, #ff7e5f, #feb47b);
  color: white;
  padding: 18px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

/* CONTAINER */
.container { padding: 12px; }

/* SEARCH */
input {
  width: 100%;
  padding: 12px;
  border-radius: 25px;
  border: none;
  margin-bottom: 10px;
}

/* BUTTONS */
.top-bar { display: flex; gap: 10px; }

button {
  flex: 1;
  padding: 12px;
  border-radius: 25px;
  border: none;
  color: white;
  font-weight: bold;
}

.refresh { background: linear-gradient(135deg,#f7971e,#ffd200); }
.cartBtn { background: linear-gradient(135deg,#00c9ff,#92fe9d); color:#111; }

/* CARD */
.card {
  background: white;
  border-radius: 18px;
  padding: 12px;
  margin-top: 12px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.2);
  display: flex;
  justify-content: space-between;
}

.name { font-weight: bold; }
.low { color: orange; }
.out { color: red; }

.qty {
  width: 60px;
  padding: 6px;
  border-radius: 10px;
  text-align: center;
}

.add {
  margin-top: 5px;
  padding: 6px 12px;
  border-radius: 10px;
  background: linear-gradient(135deg,#36d1dc,#5b86e5);
  color: white;
}

/* CART PANEL */
#cartBox {
  position: fixed;
  bottom: 0;
  width: 100%;
  height: 75%;
  background: white;
  border-radius: 25px 25px 0 0;
  display: none;
  padding: 15px;
  overflow-y: auto;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  padding: 10px;
  border-radius: 12px;
  background: #f1f5f9;
}

.remove {
  background: red;
  color: white;
  border-radius: 6px;
  padding: 4px 8px;
}

/* BADGE */
.badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: red;
  color: white;
  font-size: 12px;
  padding: 2px 6px;
  border-radius: 50%;
}
</style>
</head>

<body>

<header>🛠️ GLOBAL INDIA CERAMICS</header>

<div class="container">

  <input type="text" id="search" placeholder="🔍 Search..." onkeyup="searchProduct()">

  <div class="top-bar">
    <button id="refreshBtn" class="refresh" onclick="refreshData()">🔄</button>

    <div style="position:relative;flex:1;">
      <button class="cartBtn" onclick="openCart()">🛒 Cart</button>
      <div class="badge" id="cartCount">0</div>
    </div>
  </div>

  <div id="lastUpdated"></div>
  <div id="stockList">Loading...</div>

</div>

<!-- CART -->
<div id="cartBox">
  <h3>🛒 Your Cart</h3>
  <div id="cartItems"></div>
  <br>
  <button onclick="sendCart()" class="cartBtn">Send Order</button>
  <button onclick="clearCart()" style="background:red;">Clear</button>
  <button onclick="closeCart()" style="background:gray;">Close</button>
</div>

<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ7ErfBOZPbe4khlHRrx5wgEFl6D13sWJ9Tk9TKhRVSgJ3edXB6Pe7NHygWEHsAbf9mcXkypsvdf9nU/pub?gid=0&output=csv";

let cart = [];
let allProducts = [];

function loadData(){
  fetch(sheetURL)
    .then(res => res.text())
    .then(data => {
      let rows = data.split("\n").slice(1);
      allProducts = [];

      rows.forEach(row=>{
        let cols = row.split(",");
        let product = cols[0];
        let qty = parseInt(cols[1]);
        if(!product) return;
        allProducts.push({product, qty});
      });

      renderProducts(allProducts);
      document.getElementById("lastUpdated").innerText =
        "Updated: " + new Date().toLocaleTimeString();
    });
}

function renderProducts(products){
  let container = document.getElementById("stockList");
  container.innerHTML = "";

  products.forEach(item=>{
    let cls="", text=item.qty;
    if(item.qty===0){text="Out";cls="out";}
    else if(item.qty<5){cls="low";}

    let id=btoa(item.product);

    let div=document.createElement("div");
    div.className="card";

    div.innerHTML=`
      <div>
        <div class="name">${item.product}</div>
        <div class="${cls}">Stock: ${text}</div>
      </div>

      <div>
        <input type="number" min="1" max="${item.qty}" value="1" id="qty-${id}" class="qty">
        ${item.qty===0 ? "Out" :
        `<button class="add" onclick="addToCart('${item.product}',${item.qty})">Add</button>`}
      </div>
    `;

    container.appendChild(div);
  });
}

function addToCart(product, stockQty){
  let qty=parseInt(document.getElementById("qty-"+btoa(product)).value);
  if(!qty||qty<=0) return;
  if(qty>stockQty) return;

  let exist=cart.find(i=>i.product===product);
  if(exist){exist.qty+=qty;}
  else{cart.push({product,qty});}

  updateCart();
}

function updateCart(){
  document.getElementById("cartCount").innerText=cart.length;
}

function openCart(){
  let div=document.getElementById("cartItems");
  if(cart.length===0){
    div.innerHTML="Cart empty";
  }else{
    div.innerHTML=cart.map((i,idx)=>`
      <div class="cart-item">
        ${i.product} (x${i.qty})
        <button class="remove" onclick="removeItem(${idx})">X</button>
      </div>
    `).join("");
  }
  document.getElementById("cartBox").style.display="block";
}

function closeCart(){
  document.getElementById("cartBox").style.display="none";
}

function removeItem(i){
  cart.splice(i,1);
  openCart();
  updateCart();
}

function clearCart(){
  cart=[];
  openCart();
  updateCart();
}

function sendCart(){
  if(!cart.length) return;
  let msg="Order:\n\n";
  cart.forEach(i=>{
    msg+=`${i.product} - ${i.qty}\n`;
  });
  window.open(`https://wa.me/916360397604?text=${encodeURIComponent(msg)}`);
  cart=[];
  updateCart();
}

function searchProduct(){
  let v=document.getElementById("search").value.toLowerCase();
  renderProducts(allProducts.filter(p=>p.product.toLowerCase().includes(v)));
}

function refreshData(){ loadData(); }

loadData();
</script>

</body>
</html>
