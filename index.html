<!DOCTYPE html>
<html>
<head>
  <title>GLOBAL INDIA CERAMICS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1f2d3d">

  <style>
    body { font-family: Arial; margin: 0; background: #eef2f7; }

    header {
      background: #1f2d3d;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 22px;
    }

    .container { padding: 15px; }

    input {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    #search {
      width: 100%;
      margin-bottom: 10px;
    }

    button {
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #3498db;
      color: white;
      cursor: pointer;
    }

    .cart-btn {
      width: 100%;
      margin-bottom: 10px;
      background: #25D366;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th {
      background: #3498db;
      color: white;
      padding: 10px;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    .out {
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>🛠️ GLOBAL INDIA CERAMICS👑</header>

<div class="container">

  <input type="text" id="search" placeholder="Search product..." onkeyup="searchProduct()">

  <button class="cart-btn" onclick="sendCart()">🛒 Send Order (WhatsApp)</button>

  <table id="stockTable">
    <tr>
      <th>Product</th>
      <th>Stock</th>
      <th>Qty</th>
      <th>Action</th>
    </tr>
  </table>

</div>

<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ7ErfBOZPbe4khlHRrx5wgEFl6D13sWJ9Tk9TKhRVSgJ3edXB6Pe7NHygWEHsAbf9mcXkypsvdf9nU/pub?gid=0&single=true&output=csv";

let cart = [];

function loadData() {
  let table = document.getElementById("stockTable");

  table.innerHTML = `
    <tr>
      <th>Product</th>
      <th>Stock</th>
      <th>Qty</th>
      <th>Action</th>
    </tr>
  `;

  fetch(sheetURL)
    .then(res => res.text())
    .then(data => {
      let rows = data.split("\n").slice(1);

      rows.forEach(row => {
        let cols = row.split(",");
        let product = cols[0];
        let qty = parseInt(cols[1]);

        if (!product) return;

        let qtyText = qty === 0 ? "Out of Stock" : qty;

        let tr = document.createElement("tr");

        tr.innerHTML = `
          <td>${product}</td>
          <td class="${qty === 0 ? "out" : ""}">${qtyText}</td>
          <td>
            <input type="number" min="1" max="${qty}" value="1" id="qty-${product}" style="width:60px;">
          </td>
          <td>
            ${qty === 0 
              ? '<span style="color:gray;">Out</span>' 
              : `<button onclick="addToCart('${product}', ${qty})">Add</button>`}
          </td>
        `;

        table.appendChild(tr);
      });
    });
}

function addToCart(product, stockQty) {
  let qty = parseInt(document.getElementById(`qty-${product}`).value);

  if (!qty || qty <= 0) {
    alert("Enter valid quantity");
    return;
  }

  if (qty > stockQty) {
    alert("Not enough stock");
    return;
  }

  cart.push({ product, qty });
  alert(product + " added to cart");
}

function sendCart() {
  if (cart.length === 0) {
    alert("Cart is empty");
    return;
  }

  const phone = "916360397604"; // ✅ YOUR NUMBER

  let message = "Hello, I want to order:\n\n";

  cart.forEach(item => {
    message += `${item.product} - Qty: ${item.qty}\n`;
  });

  message += "\nPlease confirm.";

  const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
  window.open(url, "_blank");

  cart = [];
}

function searchProduct() {
  let input = document.getElementById("search").value.toLowerCase();
  let rows = document.querySelectorAll("#stockTable tr");

  rows.forEach((row, index) => {
    if (index === 0) return;
    let text = row.innerText.toLowerCase();
    row.style.display = text.includes(input) ? "" : "none";
  });
}

loadData();

// PWA
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
