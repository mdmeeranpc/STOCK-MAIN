<!DOCTYPE html>
<html>
<head>
  <title>GLOBAL INDIA CERAMICS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f1f5f9;
    }

    header {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      padding: 15px;
    }

    #search {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .refresh-btn {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: #f59e0b;
      color: white;
      margin-bottom: 8px;
    }

    .cart-btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #22c55e;
      color: white;
      font-size: 16px;
      margin-bottom: 8px;
    }

    #lastUpdated {
      font-size: 12px;
      color: gray;
      margin-bottom: 10px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title { font-weight: bold; }
    .stock { font-size: 13px; }

    .low { color: orange; }
    .out { color: red; }

    .actions {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .qty { width: 60px; }

    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px;
    }
  </style>
</head>

<body>

<header>🛠️ GLOBAL INDIA CERAMICS</header>

<div class="container">

  <input type="text" id="search" placeholder="🔍 Search product..." onkeyup="searchProduct()">

  <button class="refresh-btn" onclick="refreshData()">🔄 Refresh</button>

  <div id="lastUpdated">Last updated: --</div>

  <button class="cart-btn" onclick="sendCart()">🛒 Send Order (WhatsApp)</button>

  <div id="stockList"></div>

</div>

<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ7ErfBOZPbe4khlHRrx5wgEFl6D13sWJ9Tk9TKhRVSgJ3edXB6Pe7NHygWEHsAbf9mcXkypsvdf9nU/pub?gid=0&single=true&output=csv";

let cart = [];
let allProducts = [];
let previousData = {};

function loadData() {
  fetch(sheetURL)
    .then(res => res.text())
    .then(data => {
      let rows = data.split("\n").slice(1);
      allProducts = [];

      rows.forEach(row => {
        let cols = row.split(",");
        let product = cols[0];
        let qty = parseInt(cols[1]);

        if (!product) return;

        // 🔔 Detect change
        if (previousData[product] !== undefined && previousData[product] !== qty) {
          showNotification(product, previousData[product], qty);
        }

        previousData[product] = qty;

        allProducts.push({ product, qty });
      });

      renderProducts(allProducts);

      // 🕒 Update time
      document.getElementById("lastUpdated").innerText =
        "Last updated: " + new Date().toLocaleTimeString();
    });
}

function renderProducts(products) {
  let container = document.getElementById("stockList");
  container.innerHTML = "";

  products.sort((a,b)=>a.qty-b.qty);

  products.forEach(item => {
    let stockText = item.qty;
    let cls = "";

    if(item.qty === 0){
      stockText = "Out of Stock";
      cls = "out";
    } else if(item.qty < 5){
      stockText = item.qty + " (Low)";
      cls = "low";
    }

    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div>
        <div class="title">${item.product}</div>
        <div class="stock ${cls}">Stock: ${stockText}</div>
      </div>

      <div class="actions">
        <input type="number" min="1" max="${item.qty}" value="1" id="qty-${item.product}" class="qty">
        ${
          item.qty === 0
          ? `<span style="color:gray;">Out</span>`
          : `<button class="btn" onclick="addToCart('${item.product}', ${item.qty})">Add</button>`
        }
      </div>
    `;

    container.appendChild(div);
  });
}

function addToCart(product, stockQty){
  let qty = parseInt(document.getElementById(`qty-${product}`).value);

  if(!qty || qty<=0) return alert("Enter valid qty");
  if(qty > stockQty) return alert("Not enough stock");

  cart.push({product, qty});
  alert(product + " added");
}

function sendCart(){
  if(!cart.length) return alert("Cart empty");

  const phone = "916360397604";

  let msg = "Hello, I want to order:\n\n";

  cart.forEach(i=>{
    msg += `${i.product} - Qty: ${i.qty}\n`;
  });

  msg += "\nPlease confirm.";

  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`);

  cart=[];
}

function searchProduct(){
  let input = document.getElementById("search").value.toLowerCase();
  let filtered = allProducts.filter(p => p.product.toLowerCase().includes(input));
  renderProducts(filtered);
}

function refreshData(){
  loadData();
  let btn = document.querySelector(".refresh-btn");
  btn.innerText = "✅ Updated";
  setTimeout(()=>btn.innerText="🔄 Refresh",2000);
}

// 🔔 Notification
function showNotification(product, oldQty, newQty){
  alert(`Stock changed:\n${product}\n${oldQty} → ${newQty}`);

  let audio = new Audio("https://www.soundjay.com/buttons/beep-01a.mp3");
  audio.play();
}

// 🔄 Auto refresh every 30 sec
setInterval(loadData, 30000);

loadData();

// PWA
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
